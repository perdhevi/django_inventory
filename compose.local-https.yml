services:
  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_local_data:/data
      - caddy_local_config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  caddy_local_data:
  caddy_local_config: